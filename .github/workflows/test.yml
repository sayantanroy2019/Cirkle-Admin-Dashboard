name: test

# Lint + unit tests on every pull request and every push to main. No secrets:
# these are pure unit tests (jsdom / node), never the backend's DB suite.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
